<!DOCTYPE html><html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gestão pessoal</title><style>
:root{--purple:#6d4bd1;--light:#f5f1ff;--ink:#29243a;--muted:#77718b}*{box-sizing:border-box}body{margin:0;background:#f7f6fb;color:var(--ink);font-family:Arial,sans-serif}.top{background:linear-gradient(120deg,#6d4bd1,#9077e8);color:white;padding:28px max(24px,calc((100% - 1100px)/2))}.top h1{margin:0 0 8px}.top p{margin:0;opacity:.9}.wrap{max-width:1100px;margin:28px auto;padding:0 20px}.notice{padding:12px 16px;border-radius:10px;background:#e8f8ed;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{background:white;border-radius:18px;padding:22px;box-shadow:0 5px 22px #2b17400c;border:1px solid #ece8f5}.card h2{margin-top:0;font-size:21px}.form{display:grid;gap:10px;margin-bottom:20px}.form input{padding:11px 12px;border:1px solid #ddd6ef;border-radius:9px;font-size:14px}.btn{border:0;background:var(--purple);color:white;border-radius:9px;padding:11px 14px;cursor:pointer;font-weight:bold}.btn.delete{background:#fff0f0;color:#b42332;padding:7px 10px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid #eee9f6}th{color:var(--muted)}.empty{color:var(--muted);font-size:14px;padding:12px 0}.tag{font-size:12px;color:var(--purple);background:var(--light);padding:5px 8px;border-radius:99px}@media(max-width:750px){.grid{grid-template-columns:1fr}.wrap{margin:18px auto}.card{padding:16px}table{font-size:12px}}
</style></head><body><header class="top"><h1>Gestão Pessoal</h1><p>Cadastro de funcionários e controle das contas do mês</p></header><main class="wrap"><div class="notice" th:if="${sucesso}" th:text="${sucesso}"></div><div class="notice" th:if="${erro}" th:text="${erro}"></div><div class="grid"><section class="card"><h2>Funcionários <span class="tag" th:text="${funcionarios.size()} + ' cadastrados'"></span></h2><form class="form" th:action="@{/funcionarios}" th:object="${novoFuncionario}" method="post"><input th:field="*{nome}" placeholder="Nome completo" required><input th:field="*{cpf}" placeholder="CPF" required><input th:field="*{salario}" type="number" min="0" step="0.01" placeholder="Salário (R$)" required><button class="btn" type="submit">+ Cadastrar funcionário</button></form><div class="empty" th:if="${#lists.isEmpty(funcionarios)}">Nenhum funcionário cadastrado ainda.</div><table th:if="${!#lists.isEmpty(funcionarios)}"><thead><tr><th>Nome</th><th>CPF</th><th>Salário</th><th></th></tr></thead><tbody><tr th:each="f : ${funcionarios}"><td th:text="${f.nome}"></td><td th:text="${f.cpf}"></td><td th:text="${'R$ ' + #numbers.formatDecimal(f.salario,1,2)}"></td><td><form th:action="@{/funcionarios/{id}/excluir(id=${f.id})}" method="post"><button class="btn delete" type="submit">Excluir</button></form></td></tr></tbody></table></section><section class="card"><h2>Contas do mês <span class="tag" th:text="${contas.size()} + ' contas'"></span></h2><form class="form" th:action="@{/contas}" th:object="${novaConta}" method="post"><input th:field="*{descricao}" placeholder="Descrição da conta" required><input th:field="*{valor}" type="number" min="0" step="0.01" placeholder="Valor (R$)" required><button class="btn" type="submit">+ Adicionar conta</button></form><div class="empty" th:if="${#lists.isEmpty(contas)}">Nenhuma conta cadastrada ainda.</div><table th:if="${!#lists.isEmpty(contas)}"><thead><tr><th>Descrição</th><th>Valor</th><th>Cadastro</th><th></th></tr></thead><tbody><tr th:each="c : ${contas}"><td th:text="${c.descricao}"></td><td th:text="${'R$ ' + #numbers.formatDecimal(c.valor,1,2)}"></td><td th:text="${c.dtCadastro}"></td><td><form th:action="@{/contas/{id}/excluir(id=${c.id})}" method="post"><button class="btn delete" type="submit">Excluir</button></form></td></tr></tbody></table><p><strong>Total:</strong> <span th:text="${'R$ ' + #numbers.formatDecimal(#aggregates.sum(contas.![valor]),1,2)}"></span></p></section></div></main></body></html>
